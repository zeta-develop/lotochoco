name: Build and Release Android APK

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 3️⃣ Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 4️⃣ Enable Corepack & ensure pnpm
      - name: Enable Corepack & ensure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      # 5️⃣ Install dependencies
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 6️⃣ Generate Android project if not exists
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            pnpm cap:add:android
          fi

      # 7️⃣ Set app version and inject into Android App Gradle
      - name: Set app version and inject into Gradle
        run: |
          VERSION_NAME=$(jq -r '.version' package.json)
          VERSION_CODE=${GITHUB_RUN_NUMBER}
          
          echo "APP_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"
          
          # Actualiza dinámicamente las líneas del versionCode y versionName
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" ./android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" ./android/app/build.gradle
          
          echo "Inyectado en Android -> versionCode: $VERSION_CODE, versionName: $VERSION_NAME"

      # 8️⃣ Build Next.js
      - name: Build Next.js
        run: pnpm build

      # 9️⃣ Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 1️⃣0️⃣ Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 1️⃣1️⃣ Sync Capacitor
      - name: Sync Capacitor
        run: pnpm cap:sync:android

      # 1️⃣2️⃣ Configure release signing
      - name: Configure release signing
        env:
          KEYSTORE_CRYPT_KEY: ${{ secrets.KEYSTORE_CRYPT_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          
          # Desencriptar de forma binaria exacta el keystore original
          gpg --quiet --batch --yes --decrypt --passphrase "$KEYSTORE_CRYPT_KEY" \
            --output android/app/release.keystore android/app/release.keystore.gpg
          
          # Limpiar y escribir el archivo gradle.properties
          rm -f android/gradle.properties
          printf '%s\n' \
            'RELEASE_STORE_FILE=release.keystore' \
            "RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" \
            "RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS" \
            "RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" \
            >> android/gradle.properties

      # 1️⃣3️⃣ Build and auto-sign release APK
      - name: Build release APK
        run: pnpm android:build:release

      # 1️⃣4️⃣ Upload APK as artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lotochoco-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      # 1️⃣5️⃣ Create GitHub Release and upload APK
      - name: Create GitHub Release and upload APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: android/app/build/outputs/apk/release/*.apk
          tag: "v${{ env.APP_VERSION }}-${{ github.run_number }}"
          name: "LotoChoco v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false