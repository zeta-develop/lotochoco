name: Build Android release candidate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a public release signed with the replacement identity
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sql-tests:
    uses: ./.github/workflows/sql-tests.yml
    permissions:
      contents: read
  build-apk:
    needs: sql-tests
    runs-on: ubuntu-latest
    environment: LotoChoco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Set release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(node -p 'require("./package.json").version')
          echo "ANDROID_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"
      - name: Build web application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm run cap:sync:android
      - name: Build with replacement signing identity
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.REPLACEMENT_ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.REPLACEMENT_ANDROID_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.REPLACEMENT_ANDROID_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.REPLACEMENT_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          export RELEASE_STORE_FILE="$RUNNER_TEMP/replacement.keystore"
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          CERT_FINGERPRINT=$(keytool -exportcert -keystore "$RELEASE_STORE_FILE" -storepass:env RELEASE_STORE_PASSWORD -alias "$RELEASE_KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)
          if [ "${CERT_FINGERPRINT^^}" = '37E6C2C4DC0FFA4C72E8089AF89A406C2753F6DEA484B8E437C9423D329E42BD' ]; then
            echo '::error::The compromised signing identity must not be reused.'
            exit 1
          fi
          cd android
          bash ./gradlew clean assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: lotochoco-release-candidate
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
      - name: Create release candidate
        uses: ncipollo/release-action@v1
        with:
          artifacts: android/app/build/outputs/apk/release/*.apk
          tag: 'v${{ env.APP_VERSION }}-${{ github.run_number }}'
          name: 'LotoChoco v${{ env.APP_VERSION }} candidate'
          draft: ${{ !inputs.publish }}
          prerelease: false
          makeLatest: ${{ inputs.publish }}
          body: |
            Comprobante digital rediseñado para compartir imágenes completas por WhatsApp.
            Correcciones de aislamiento por empresa, operaciones financieras y autenticación.

            APK firmado con una identidad de reemplazo. No se instala como una actualización normal sobre el APK firmado con la identidad anterior. Verificar y resolver ventas pendientes antes de cualquier reinstalación; conservar los datos locales necesarios.
            Comprobar instalación, OAuth e impresora en el dispositivo. La firma de reemplazo es compatible con las versiones 1.8.8 y posteriores.
