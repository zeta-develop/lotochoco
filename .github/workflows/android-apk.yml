name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Node.js setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3️⃣ Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Enable Corepack & prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Ensure pnpm available
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            npm install -g pnpm@10
          fi
          pnpm -v

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 5️⃣ Set app version
      - name: Set app version
        run: |
          APP_VERSION=$(node -p 'require("./package.json").version')
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          APP_VERSION_CODE=$GITHUB_RUN_NUMBER
          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"

      # 6️⃣ Build Next.js
      - name: Build Next.js
        run: pnpm build

      # 7️⃣ Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 8️⃣ Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 9️⃣ Generate Android project if needed
      - name: Generate Android project
        run: pnpm cap:add:android

      # 🔟 Sync Capacitor
      - name: Sync Capacitor
        run: pnpm cap:sync:android

      # 1️⃣1️⃣ Configure release signing
      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p android/app

          # Restaurar keystore desde GitHub Secrets
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

          # Escribir gradle.properties para firma
          printf '%s\n' \
            'RELEASE_STORE_FILE=release-keystore.jks' \
            "RELEASE_STORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" \
            "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" \
            "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" \
            >> android/gradle.properties

          # Ejecutar script si lo necesitas (opcional)
          if [ -f scripts/inject_android_release_signing.py ]; then
            python3 scripts/inject_android_release_signing.py
          fi

      # 1️⃣2️⃣ Build release APK
      - name: Build release APK
        run: pnpm android:build:release

      # 1️⃣3️⃣ Upload APK artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lotochoco-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk