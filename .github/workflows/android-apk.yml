name: Build and Release Android APK

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 3️⃣ Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 4️⃣ Enable Corepack & ensure pnpm
      - name: Enable Corepack & ensure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      # 5️⃣ Install dependencies
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 6️⃣ Generate Android project if not exists
      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            pnpm cap:add:android
          fi

      # 7️⃣ Set app version and inject into Android App Gradle
      - name: Set app version and inject into Gradle
        run: |
          VERSION_NAME=$(jq -r '.version' package.json)
          VERSION_CODE=${GITHUB_RUN_NUMBER}
          
          echo "APP_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"
          
          # Actualiza dinámicamente el versionCode y versionName en el Gradle del módulo app
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" ./android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" ./android/app/build.gradle
          
          echo "Inyectado en Android -> versionCode: $VERSION_CODE, versionName: $VERSION_NAME"

      # 8️⃣ Build Next.js
      - name: Build Next.js
        run: pnpm build

      # 9️⃣ Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 1️⃣0️⃣ Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 1️⃣1️⃣ Sync Capacitor
      - name: Sync Capacitor
        run: pnpm cap:sync:android

      # 1️⃣2️⃣ Configure release signing (CON SOPORTE ANDROIDX Y JETIFIER)
      - name: Configure release signing
        run: |
          set -euo pipefail
          
          # Forzamos la eliminación de archivos de propiedades previos
          rm -f android/gradle.properties
          
          # Escribimos los valores de firma Y activamos las flags de compatibilidad necesarias por SQLite
          cat << 'EOF' > android/gradle.properties
          RELEASE_STORE_FILE=app/release.keystore
          RELEASE_STORE_PASSWORD=LotoChoco
          RELEASE_KEY_ALIAS=lotochoco-alias
          RELEASE_KEY_PASSWORD=LotoChoco
          
          # Soporte para plugins heredados y dependencias biométricas/sqlite
          android.useAndroidX=true
          android.enableJetifier=true

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "=== Archivo gradle.properties generado con éxito ==="

      # 1️⃣3️⃣ Build and auto-sign release APK (Con limpieza de caché incremental)
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease

          # Renombrar el APK para que tenga un nombre consistente
          mkdir -p final-apk
          cp app/build/outputs/apk/release/app-release.apk final-apk/app-release.apk

      # 1️⃣4️⃣ Upload APK as artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/final-apk/app-release.apk

      # 1️⃣5️⃣ Create GitHub Release and upload APK
      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          files: android/final-apk/app-release.apk
          tag_name: "v${{ env.APP_VERSION }}.${{ github.run_number }}"
          name: "LotoChoco v${{ env.APP_VERSION }} (Build ${{ github.run_number }})"
          draft: false
          prerelease: false
          body: |
            ### 📱 Nueva Versión de LotoChoco
            - Versión: `${{ env.APP_VERSION }}`
            - Build: `${{ github.run_number }}`
            - Commit: `${{ github.sha }}`

            Descarga el archivo `app-release.apk` para instalar en tu dispositivo Android.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
