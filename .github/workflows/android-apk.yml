name: Build and Release Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3️⃣ Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 4️⃣ Enable Corepack & ensure pnpm
      - name: Enable Corepack & ensure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          if ! command -v pnpm >/dev/null 2>&1; then
            npm install -g pnpm@10
          fi
          pnpm -v

      # 5️⃣ Install dependencies
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 6️⃣ Set app version and code
      - name: Set app version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # 7️⃣ Build Next.js
      - name: Build Next.js
        run: pnpm build

      # 8️⃣ Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 9️⃣ Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 🔟 Generate Android project
      - name: Generate Android project
        run: pnpm cap:add:android

      # 1️⃣1️⃣ Sync Capacitor
      - name: Sync Capacitor
        run: pnpm cap:sync:android

      # 1️⃣2️⃣ Configure release signing
      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app

          # Decode the JKS keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

          # Add signing info to gradle.properties
          printf '%s\n' \
            'RELEASE_STORE_FILE=release-keystore.jks' \
            "RELEASE_STORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" \
            "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" \
            "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" \
            >> android/gradle.properties

      # 1️⃣3️⃣ Build release APK
      - name: Build release APK
        run: pnpm android:build:release

      # 1️⃣4️⃣ Upload APK artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lotochoco-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # 1️⃣5️⃣ Create GitHub Release and upload APK
      - name: Create GitHub Release and upload APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: android/app/build/outputs/apk/release/app-release.apk
          tag: "v${{ env.APP_VERSION }}"
          name: "LotoChoco v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false