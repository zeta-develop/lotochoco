name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # remove cache here to avoid setup-node trying to run pnpm before it's available

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Enable Corepack & prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Ensure pnpm available
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found — installing global pnpm@10"
            npm install -g pnpm@10
          fi
          pnpm -v

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Next.js
        run: pnpm build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project
        run: pnpm cap:add:android

      - name: Sync Capacitor
        run: pnpm cap:sync:android

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p android/app

          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${RELEASE_KEYSTORE_PASSWORD:-}" ] && [ -n "${RELEASE_KEY_ALIAS:-}" ] && [ -n "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          else
            echo "Release signing secrets not found; generating a temporary release keystore for this build."
            keytool -genkeypair \
              -keystore android/app/release-keystore.jks \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -dname "CN=Lotochoco, OU=Release, O=Lotochoco, L=Local, S=NA, C=NI"
            RELEASE_KEYSTORE_PASSWORD=android
            RELEASE_KEY_ALIAS=release
            RELEASE_KEY_PASSWORD=android
          fi

          printf '%s\n' \
            'RELEASE_STORE_FILE=app/release-keystore.jks' \
            "RELEASE_STORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" \
            "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" \
            "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" \
            >> android/gradle.properties

            python3 scripts/inject_android_release_signing.py

      - name: Build release APK
        run: pnpm android:build:release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lotochoco-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk