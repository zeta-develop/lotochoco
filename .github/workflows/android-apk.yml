name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # remove cache here to avoid setup-node trying to run pnpm before it's available

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Enable Corepack & prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Ensure pnpm available
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found — installing global pnpm@10"
            npm install -g pnpm@10
          fi
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project
        run: pnpm cap:add:android

      - name: Sync Capacitor
        run: pnpm cap:sync:android

      - name: Build debug APK
        run: pnpm android:build:debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lotochoco-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk