name: Supabase migration with encrypted backup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect the existing database or apply the audited migration
        type: choice
        options: [preflight, apply]
        default: preflight
        required: true
      company_time_zone:
        description: Confirmed IANA time zone for the existing companies (required to apply)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: supabase-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    container: postgres:18
    environment: LotoChoco
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSWORD: ${{ secrets.SUPABASE_BACKUP_PASSWORD }}
      MIGRATION_MODE: ${{ inputs.mode }}
      COMPANY_TIME_ZONE: ${{ inputs.company_time_zone }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: '15'
    steps:
      - uses: actions/checkout@v4
      - name: Install backup encryption tool
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openssl ca-certificates python3
      - name: Check required credentials
        run: |
          test -n "$DATABASE_URL" || { echo 'SUPABASE_DB_URL is required in environment LotoChoco'; exit 1; }
          test -n "$BACKUP_PASSWORD" || { echo 'SUPABASE_BACKUP_PASSWORD is required'; exit 1; }
          if [ "$MIGRATION_MODE" = apply ]; then
            test -n "$COMPANY_TIME_ZONE" || { echo 'Confirmed company_time_zone is required'; exit 1; }
          fi
          command -v openssl
      - name: Back up application and authentication schemas
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p migration-private
          pg_dump "$DATABASE_URL" --format=custom --schema=public --schema=auth --no-owner --no-acl --file=migration-private/database.dump 2>migration-private/backup.log || { echo 'Backup failed; migration was not applied'; exit 1; }
          pg_restore --list migration-private/database.dump > migration-private/backup-manifest.txt
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/preflight.sql > migration-private/preflight.txt 2>&1 || { echo 'Preflight failed; migration was not applied'; exit 1; }
          tar -czf migration-private/backup.tar.gz -C migration-private database.dump backup-manifest.txt preflight.txt backup.log
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:BACKUP_PASSWORD -in migration-private/backup.tar.gz -out migration-private/backup.tar.gz.enc
          rm migration-private/database.dump migration-private/backup.tar.gz migration-private/backup-manifest.txt migration-private/preflight.txt migration-private/backup.log
      - uses: actions/upload-artifact@v4
        with:
          name: supabase-encrypted-backup-${{ github.run_id }}
          path: migration-private/backup.tar.gz.enc
          retention-days: 30
          if-no-files-found: error
      - name: Apply transactional migration
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/prepare-deployment-migration.py migration-private/prepared-migration.sql
          if ! psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -v company_time_zone="$COMPANY_TIME_ZONE" -f migration-private/prepared-migration.sql > migration-private/migration.log 2>&1; then
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:BACKUP_PASSWORD -in migration-private/migration.log -out migration-private/migration.log.enc
            rm migration-private/migration.log
            echo 'Migration failed and its transaction rolled back; inspect encrypted diagnostics'
            exit 1
          fi
          rm migration-private/migration.log
          echo 'Transactional migration applied successfully'
      - name: Encrypt failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -d migration-private ] && [ -n "$BACKUP_PASSWORD" ]; then
            tar -czf /tmp/migration-diagnostics.tar.gz -C migration-private .
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:BACKUP_PASSWORD -in /tmp/migration-diagnostics.tar.gz -out migration-private/diagnostics.tar.gz.enc
            rm /tmp/migration-diagnostics.tar.gz
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: supabase-encrypted-diagnostics-${{ github.run_id }}
          path: migration-private/*.enc
          if-no-files-found: ignore
          retention-days: 30
